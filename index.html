<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<link rel="apple-touch-icon" sizes="512x512" href="assets/icon-512.png">
<title>🔌 工程师工作台</title>
<!-- 外部CDN库 -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/styles/github.min.css">
<script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mammoth@1.6.0/mammoth.browser.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked@11.1.1/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/highlight.min.js"></script>
<style>
/* ============ 全局变量与重置 ============ */
:root{
  /* 鲜艳高饱和度配色 - 小红书风格 */
  --bg:linear-gradient(135deg,#fff5f7 0%,#fef3f2 50%,#f5f3ff 100%);
  --bg-solid:#fdf2f8;
  --card:#ffffff; --border:#f1f5f9; --border-strong:#e2e8f0;
  --text:#0f172a; --text-2:#475569; --text-3:#94a3b8; --text-inv:#fff;

  /* 高饱和度主色 */
  --primary:#ef4444;         /* 小红书红 */
  --primary-hover:#dc2626;
  --primary-soft:#fee2e2;
  --secondary:#f97316;       /* 橙红 */
  --pink:#ec4899;            /* 粉红 */
  --pink-soft:#fce7f3;

  /* 强调色 */
  --success:#10b981; --success-soft:#d1fae5;
  --warn:#f59e0b; --warn-soft:#fef3c7;
  --danger:#ef4444; --danger-soft:#fee2e2;
  --info:#06b6d4; --info-soft:#cffafe;
  --purple:#a855f7; --purple-soft:#f3e8ff;
  --indigo:#6366f1; --indigo-soft:#e0e7ff;
  --cyan:#06b6d4; --cyan-soft:#cffafe;
  --yellow:#eab308; --yellow-soft:#fef9c3;
  --green:#22c55e; --green-soft:#dcfce7;

  /* 渐变 */
  --grad-primary:linear-gradient(135deg,#ef4444 0%,#f97316 100%);
  --grad-pink:linear-gradient(135deg,#ec4899 0%,#a855f7 100%);
  --grad-blue:linear-gradient(135deg,#3b82f6 0%,#a855f7 100%);
  --grad-success:linear-gradient(135deg,#10b981 0%,#84cc16 100%);
  --grad-warm:linear-gradient(135deg,#fef3c7 0%,#fce7f3 50%,#ede9fe 100%);
  --grad-cool:linear-gradient(135deg,#dbeafe 0%,#ede9fe 100%);

  --shadow-sm:0 2px 4px rgba(239,68,68,.06);
  --shadow:0 4px 12px rgba(239,68,68,.08),0 2px 4px rgba(0,0,0,.04);
  --shadow-md:0 8px 24px -4px rgba(239,68,68,.12),0 4px 8px -2px rgba(0,0,0,.06);
  --shadow-lg:0 16px 40px -8px rgba(239,68,68,.18);
  --radius:8px; --radius-sm:6px; --radius-lg:12px;
  --mono:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace;
  --sans:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--sans);background:var(--bg);background-attachment:fixed;color:var(--text);font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea,select{font-family:inherit;font-size:inherit;color:inherit}
a{color:var(--primary);text-decoration:none}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#cbd2d9;border-radius:5px;border:2px solid var(--bg)}
::-webkit-scrollbar-thumb:hover{background:#9aa5b1}
::-webkit-scrollbar-track{background:transparent}

/* ============ 通用组件 ============ */
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:10px;font-size:13px;font-weight:600;transition:all .18s;border:1px solid transparent;white-space:nowrap;letter-spacing:.2px}
.btn-primary{background:var(--grad-primary);color:#fff;box-shadow:0 2px 8px rgba(239,68,68,.25)}
.btn-primary:hover{transform:translateY(-1px);box-shadow:0 6px 16px rgba(239,68,68,.35)}
.btn-primary:active{transform:translateY(0)}
.btn-ghost{background:rgba(255,255,255,.7);border-color:var(--border);backdrop-filter:blur(8px)}
.btn-ghost:hover{background:#fff;border-color:var(--border-strong);box-shadow:var(--shadow)}
.btn-danger{background:var(--danger);color:#fff;box-shadow:0 2px 8px rgba(239,68,68,.25)}
.btn-danger:hover{background:#dc2626}
.btn-purple{background:var(--grad-pink);color:#fff;box-shadow:0 2px 8px rgba(236,72,153,.25)}
.btn-purple:hover{transform:translateY(-1px);box-shadow:0 6px 16px rgba(236,72,153,.35)}
.btn-sm{padding:5px 12px;font-size:12px;border-radius:8px}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none!important;box-shadow:none!important}
.icon-btn{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:8px;color:var(--text-2);transition:all .15s}
.icon-btn:hover{background:var(--primary-soft);color:var(--primary)}
.badge{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:700;line-height:1.5}
.input,.textarea,.select{width:100%;padding:9px 12px;border:1.5px solid var(--border);border-radius:10px;background:#fff;transition:all .15s;font-size:13px}
.input:focus,.textarea:focus,.select:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
.textarea{resize:vertical;line-height:1.6;font-family:inherit}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow)}
.tag{display:inline-block;padding:2px 9px;border-radius:6px;font-size:11px;background:var(--primary-soft);color:var(--primary);margin-right:4px;margin-top:2px;font-weight:500}
.empty-state{text-align:center;padding:48px 24px;color:var(--text-3)}
.empty-state .emoji{font-size:48px;margin-bottom:12px;opacity:.7}
.empty-state svg{margin:0 auto 12px;opacity:.4}
.empty-state h3{font-size:15px;color:var(--text-2);margin-bottom:4px;font-weight:600}
.empty-state p{font-size:13px}
.progress-bar{height:8px;background:var(--primary-soft);border-radius:4px;overflow:hidden}
.progress-bar>div{height:100%;background:var(--grad-primary);transition:width .4s cubic-bezier(.4,0,.2,1);border-radius:4px}
.toast-wrap{position:fixed;top:20px;right:20px;z-index:9999;display:flex;flex-direction:column;gap:10px}
.toast{color:#fff;padding:11px 18px;border-radius:12px;box-shadow:var(--shadow-md);font-size:13px;font-weight:500;animation:slideIn .25s;max-width:360px;backdrop-filter:blur(8px)}
.toast.info{background:rgba(15,23,42,.92)}
.toast.success{background:var(--grad-success)}
.toast.error{background:var(--grad-primary)}
.toast.warn{background:linear-gradient(135deg,#f59e0b 0%,#ea580c 100%)}
@keyframes slideIn{from{transform:translateX(40px) scale(.95);opacity:0}to{transform:translateX(0) scale(1);opacity:1}}
.spinner{width:14px;height:14px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .6s linear infinite;display:inline-block}
.spinner-dark{border-color:rgba(0,0,0,.15);border-top-color:var(--primary)}
@keyframes spin{to{transform:rotate(360deg)}}
.modal-mask{position:fixed;inset:0;background:rgba(15,23,42,.55);backdrop-filter:blur(4px);z-index:1000;display:flex;align-items:center;justify-content:center;padding:16px;animation:fade .15s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{background:#fff;border-radius:18px;box-shadow:var(--shadow-md);width:100%;max-width:520px;max-height:90vh;overflow:auto;border:1px solid var(--border)}
.modal-header{padding:18px 22px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:between}
.modal-body{padding:22px}
.modal-footer{padding:14px 22px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px;background:#f8fafc;border-radius:0 0 18px 18px}
.field{margin-bottom:14px}
.field label{display:block;font-size:12px;font-weight:700;color:var(--text);margin-bottom:6px}
.field .hint{font-size:11px;color:var(--text-3);margin-top:4px}

/* ============ 应用布局 ============ */
.app{display:flex;flex-direction:column;height:100vh}
.topbar{display:flex;align-items:center;background:linear-gradient(135deg,#ffffff 0%,#fff5f7 100%);border-bottom:1px solid var(--border);padding:0 16px;height:56px;flex-shrink:0;box-shadow:0 2px 12px rgba(239,68,68,.06);z-index:10;backdrop-filter:blur(10px)}
.topbar .logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:16px;color:var(--text);margin-right:20px;background:linear-gradient(135deg,#ef4444,#a855f7);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.topbar .logo .logo-icon{width:34px;height:34px;background:var(--grad-primary);border-radius:10px;display:flex;align-items:center;justify-content:center;color:#fff;box-shadow:0 4px 12px rgba(239,68,68,.3);font-size:18px}
.tabs{display:flex;gap:4px;flex:1}
.tab{padding:9px 14px;border-radius:10px;font-size:13px;font-weight:600;color:var(--text-2);transition:all .18s;display:flex;align-items:center;gap:6px;background:transparent}
.tab:hover{background:rgba(239,68,68,.06);color:var(--text)}
.tab.active{background:var(--grad-primary);color:#fff;box-shadow:0 4px 12px rgba(239,68,68,.25);transform:translateY(-1px)}
.tab.active svg{color:#fff!important}
.topbar-actions{display:flex;align-items:center;gap:8px}
.main{flex:1;display:flex;overflow:hidden;background:transparent}
.sidebar{width:260px;background:rgba(255,255,255,.85);backdrop-filter:blur(12px);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;overflow:hidden}
.sidebar-head{padding:14px 16px 10px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.sidebar-head h3{font-size:12px;font-weight:800;color:var(--text-3);text-transform:uppercase;letter-spacing:1px}
.sidebar-list{flex:1;overflow-y:auto;padding:8px}
.sidebar-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:10px;cursor:pointer;transition:all .15s;font-size:13px;color:var(--text-2);margin-bottom:2px;font-weight:500}
.sidebar-item:hover{background:rgba(239,68,68,.05);color:var(--text);transform:translateX(2px)}
.sidebar-item.active{background:var(--grad-pink);color:#fff;font-weight:600;box-shadow:0 4px 12px rgba(236,72,153,.25)}
.sidebar-item.active .count{background:rgba(255,255,255,.25);color:#fff}
.sidebar-item .dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;box-shadow:0 0 0 2px rgba(255,255,255,.5)}
.sidebar-item .name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sidebar-item .count{font-size:11px;color:var(--text-3);background:#f3f4f6;padding:1px 6px;border-radius:10px}
.sidebar-item.active .count{background:rgba(37,99,235,.15);color:var(--primary)}
.content{flex:1;overflow-y:auto;padding:24px 28px}

/* ============ 待办模块 ============ */
.todo-toolbar{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.todo-toolbar .search{flex:1;min-width:200px;position:relative}
.todo-toolbar .search input{padding-left:32px}
.todo-toolbar .search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--text-3)}
.filter-chips{display:flex;gap:6px}
.chip{padding:5px 13px;border-radius:20px;font-size:12px;background:#fff;border:1.5px solid var(--border);color:var(--text-2);cursor:pointer;transition:all .15s;font-weight:600}
.chip:hover{border-color:var(--primary);color:var(--primary);transform:translateY(-1px)}
.chip.active{background:var(--grad-primary);color:#fff;border-color:transparent;box-shadow:0 4px 10px rgba(239,68,68,.25)}
.stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}
.stat-card{position:relative;overflow:hidden;background:#fff;border:none;border-radius:14px;padding:14px 16px;box-shadow:var(--shadow);transition:all .2s}
.stat-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-md)}
.stat-card .label{font-size:11px;color:var(--text-2);font-weight:700;margin-bottom:6px;display:flex;align-items:center;gap:4px}
.stat-card .value{font-size:28px;font-weight:800;color:var(--text);line-height:1.1;letter-spacing:-.5px}
.stat-card .sub{font-size:11px;color:var(--text-3);margin-top:4px;font-weight:500}
.stat-card .value.danger{color:var(--danger)} .stat-card .value.success{color:var(--success)} .stat-card .value.warn{color:var(--warn)} .stat-card .value.primary{color:var(--primary)}
.stat-card.todo::before{content:'📋';position:absolute;right:-4px;bottom:-10px;font-size:60px;opacity:.08;pointer-events:none}
.stat-card.done::before{content:'✅';position:absolute;right:-4px;bottom:-10px;font-size:60px;opacity:.15;pointer-events:none}
.stat-card.overdue::before{content:'🔥';position:absolute;right:-4px;bottom:-10px;font-size:60px;opacity:.2;pointer-events:none}
.stat-card.total::before{content:'📊';position:absolute;right:-4px;bottom:-10px;font-size:60px;opacity:.1;pointer-events:none}
.todo-list{display:flex;flex-direction:column;gap:10px}
.todo-item{background:#fff;border:1px solid var(--border);border-radius:14px;padding:13px 16px;display:flex;align-items:flex-start;gap:12px;transition:all .2s;box-shadow:var(--shadow-sm)}
.todo-item:hover{border-color:var(--pink);box-shadow:0 8px 20px rgba(236,72,153,.15);transform:translateY(-1px)}
.todo-item.overdue{border-left:4px solid var(--danger);background:linear-gradient(90deg,var(--danger-soft) 0%,#fff 30%)}
.todo-item.done{opacity:.7;background:#f9fafb}
.todo-item.done .todo-title{text-decoration:line-through;color:var(--text-3)}
.todo-check{width:22px;height:22px;border:2.5px solid var(--border-strong);border-radius:50%;flex-shrink:0;margin-top:1px;cursor:pointer;transition:all .2s;display:flex;align-items:center;justify-content:center}
.todo-check:hover{border-color:var(--primary);transform:scale(1.1)}
.todo-item.done .todo-check{background:var(--grad-success);border-color:var(--success);color:#fff;animation:pop .3s}
@keyframes pop{0%{transform:scale(.7)}50%{transform:scale(1.2)}100%{transform:scale(1)}}
.todo-item.in_progress .todo-check{border-color:var(--warn);background:var(--warn-soft)}
.todo-body{flex:1;min-width:0}
.todo-title{font-size:14px;font-weight:500;color:var(--text);word-break:break-word}
.todo-meta{display:flex;align-items:center;gap:8px;margin-top:5px;flex-wrap:wrap;font-size:12px;color:var(--text-3)}
.todo-meta .proj{display:flex;align-items:center;gap:4px}
.todo-actions{display:flex;gap:2px;opacity:0;transition:opacity .12s}
.todo-item:hover .todo-actions{opacity:1}
.priority-flag{font-size:12px}
.priority-flag.high{color:var(--danger)} .priority-flag.medium{color:var(--warn)} .priority-flag.low{color:var(--text-3)}
.due-tag{display:inline-flex;align-items:center;gap:3px;padding:1px 7px;border-radius:4px;font-size:11px;background:#f3f4f6}
.due-tag.overdue{background:var(--danger-soft);color:var(--danger)}
.due-tag.today{background:var(--warn-soft);color:var(--warn)}
.due-tag.soon{background:var(--info-soft);color:var(--info)}
.blocked-reason{font-size:12px;color:var(--danger);background:var(--danger-soft);padding:4px 8px;border-radius:4px;margin-top:6px;display:flex;align-items:center;gap:4px}

/* ============ 知识库模块 ============ */
.knowledge-input{background:linear-gradient(135deg,#fff 0%,#fffbeb 100%);border:1.5px solid var(--yellow);border-radius:16px;padding:14px;margin-bottom:16px;box-shadow:0 4px 16px rgba(234,179,8,.12)}
.knowledge-input textarea{border:none;box-shadow:none;padding:0;resize:vertical;min-height:60px;background:transparent;font-size:14px}
.knowledge-input textarea:focus{outline:none;box-shadow:none}
.knowledge-input-foot{display:flex;align-items:center;justify-content:space-between;padding-top:10px;border-top:1px dashed var(--border);margin-top:8px;gap:8px}
.knowledge-cats{display:flex;gap:4px;flex-wrap:wrap}
.cat-pill{padding:4px 11px;border-radius:14px;font-size:11px;cursor:pointer;border:1.5px solid transparent;color:var(--text-2);background:#fff;transition:all .15s;font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.cat-pill:hover{border-color:var(--primary);transform:translateY(-1px)}
.cat-pill.active{background:var(--grad-primary);color:#fff;border-color:transparent;box-shadow:0 4px 10px rgba(239,68,68,.25)}
.knowledge-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}
.k-card{background:#fff;border:1px solid var(--border);border-radius:16px;padding:15px;box-shadow:var(--shadow-sm);transition:all .2s;display:flex;flex-direction:column;position:relative;overflow:hidden}
.k-card::before{content:'';position:absolute;top:0;left:0;right:0;height:4px;background:var(--grad-primary);opacity:0;transition:opacity .2s}
.k-card:hover{border-color:var(--pink);box-shadow:0 12px 28px rgba(236,72,153,.15);transform:translateY(-2px)}
.k-card:hover::before{opacity:1}
.k-card-content{font-size:13px;color:var(--text);line-height:1.65;word-break:break-word;white-space:pre-wrap;flex:1;max-height:200px;overflow:hidden;position:relative}
.k-card-content.expanded{max-height:none}
.k-card-content pre,.k-card-content code{font-family:var(--mono);font-size:12px;background:var(--bg-solid);padding:1px 5px;border-radius:3px}
.k-card-content pre{padding:8px;overflow-x:auto;margin:6px 0}
.k-card-foot{display:flex;align-items:center;justify-content:space-between;margin-top:10px;padding-top:10px;border-top:1px solid var(--border)}
.k-card-meta{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.k-summary-box{background:linear-gradient(135deg,#fef3c7 0%,#fed7aa 100%);border:1px solid #fdba74;border-radius:10px;padding:10px 12px;margin-top:10px;font-size:12px;color:#7c2d12;line-height:1.5}
.k-summary-box .label{font-weight:700;display:flex;align-items:center;gap:4px;margin-bottom:4px;color:#9a3412}

/* ============ SOP模块 ============ */
.sop-layout{display:grid;grid-template-columns:1fr 1fr;gap:16px;height:calc(100vh - 56px - 48px)}
.sop-pane{background:#fff;border:1px solid var(--border);border-radius:16px;display:flex;flex-direction:column;overflow:hidden;box-shadow:var(--shadow-sm)}
.sop-pane-head{padding:12px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;background:linear-gradient(90deg,#fff 0%,#fff5f7 100%)}
.sop-pane-head h3{font-size:14px;font-weight:700;color:var(--text)}
.sop-pane-body{flex:1;overflow:auto;padding:16px}
.sop-dropzone{border:2px dashed var(--border-strong);border-radius:var(--radius);padding:28px 20px;text-align:center;color:var(--text-3);cursor:pointer;transition:all .15s;margin-bottom:12px}
.sop-dropzone:hover,.sop-dropzone.dragover{border-color:var(--primary);background:var(--primary-soft);color:var(--primary)}
.sop-dropzone svg{margin:0 auto 8px}
.sop-source textarea{min-height:280px;font-family:var(--mono);font-size:12px;line-height:1.6}
.sop-output{font-size:13px;line-height:1.7}
.sop-output h1{font-size:20px;margin:16px 0 8px;padding-bottom:6px;border-bottom:2px solid var(--primary)}
.sop-output h2{font-size:15px;margin:14px 0 6px;color:var(--primary)}
.sop-output h3{font-size:14px;margin:10px 0 4px;color:var(--text-2)}
.sop-output ol,.sop-output ul{padding-left:22px;margin:6px 0}
.sop-output li{margin:3px 0}
.sop-output table{border-collapse:collapse;width:100%;margin:8px 0;font-size:12px}
.sop-output th,.sop-output td{border:1px solid var(--border);padding:6px 8px;text-align:left}
.sop-output th{background:#f6f8fa;font-weight:600}
.sop-output code{font-family:var(--mono);font-size:12px;background:#f6f8fa;padding:1px 5px;border-radius:3px}
.sop-output blockquote{border-left:3px solid var(--warn);background:var(--warn-soft);padding:8px 14px;margin:10px 0;color:#92400e;border-radius:0 8px 8px 0}
.sop-field-block{margin-bottom:14px}
.sop-field-block .ftitle{font-size:13px;font-weight:700;color:var(--primary);margin-bottom:4px;display:flex;align-items:center;gap:6px}
.sop-history{padding:10px 12px;background:var(--bg-solid);border-radius:10px;font-size:12px;color:var(--text-2);margin-bottom:10px}
.sop-history-item{padding:8px 12px;border:1px solid var(--border);border-radius:10px;font-size:12px;cursor:pointer;transition:all .15s;margin-bottom:6px;display:flex;justify-content:space-between;align-items:center;background:#fff}
.sop-history-item:hover{background:var(--primary-soft);border-color:var(--primary);transform:translateX(2px)}
.sop-history-item:hover{background:#f3f4f6;border-color:var(--border-strong)}

/* ============ 设置模块 ============ */
.settings-section{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px;box-shadow:var(--shadow-sm)}
.settings-section h3{font-size:15px;font-weight:600;margin-bottom:4px;display:flex;align-items:center;gap:8px}
.settings-section .desc{font-size:12px;color:var(--text-3);margin-bottom:14px}
.switch{position:relative;display:inline-block;width:38px;height:22px}
.switch input{opacity:0;width:0;height:0}
.slider{position:absolute;cursor:pointer;inset:0;background:#cbd2d9;transition:.2s;border-radius:22px}
.slider:before{content:"";position:absolute;height:18px;width:18px;left:2px;bottom:2px;background:#fff;transition:.2s;border-radius:50%}
.switch input:checked+.slider{background:var(--primary)}
.switch input:checked+.slider:before{transform:translateX(16px)}
.kw-editor .kw-cat{margin-bottom:10px;padding:10px;border:1px solid var(--border);border-radius:var(--radius-sm)}
.kw-editor .kw-cat-head{display:flex;align-items:center;gap:8px;margin-bottom:6px;font-size:12px;font-weight:600}
.kw-editor .kw-cat-head .dot{width:10px;height:10px;border-radius:50%}
.kw-editor textarea{font-size:12px;min-height:50px}

/* ============ 典型电路模块 ============ */
.circuit-thumb{width:100%;height:160px;object-fit:cover;border-radius:10px;background:var(--bg-solid);cursor:pointer;transition:transform .2s}
.circuit-thumb:hover{transform:scale(1.02)}
.circuit-file-card{height:160px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(135deg,#f0f9ff 0%,#e0f2fe 100%);border:2px dashed var(--info);border-radius:10px;color:var(--info);gap:6px}
.circuit-file-card .fname{font-size:11px;color:var(--text-2);max-width:90%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.circuit-input{background:linear-gradient(135deg,#fff 0%,#ecfeff 100%);border:1.5px solid var(--cyan);border-radius:16px;padding:14px;margin-bottom:16px;box-shadow:0 4px 16px rgba(6,182,212,.12)}
.circuit-dropzone{border:2px dashed var(--cyan);border-radius:var(--radius);padding:20px 16px;text-align:center;color:var(--text-3);cursor:pointer;transition:all .15s;margin-bottom:10px}
.circuit-dropzone:hover,.circuit-dropzone.dragover{border-color:var(--cyan);background:var(--cyan-soft);color:var(--cyan)}

/* ============ Bug汇总模块 ============ */
.bug-card{background:#fff;border:1px solid var(--border);border-radius:14px;padding:13px 16px;box-shadow:var(--shadow-sm);transition:all .2s;border-left:4px solid var(--text-3)}
.bug-card:hover{border-color:var(--pink);box-shadow:0 8px 20px rgba(236,72,153,.15);transform:translateY(-1px)}
.bug-card.sev-critical{border-left-color:var(--danger)}
.bug-card.sev-major{border-left-color:var(--secondary)}
.bug-card.sev-normal{border-left-color:var(--warn)}
.bug-card.sev-minor{border-left-color:var(--text-3)}
.bug-images{display:grid;grid-template-columns:repeat(auto-fill,minmax(80px,1fr));gap:6px;margin-top:8px}
.bug-images img{width:100%;height:80px;object-fit:cover;border-radius:6px;cursor:pointer;transition:transform .15s;border:1px solid var(--border)}
.bug-images img:hover{transform:scale(1.05)}
.bug-input{background:linear-gradient(135deg,#fff 0%,#fef2f2 100%);border:1.5px solid var(--danger);border-radius:16px;padding:14px;margin-bottom:16px;box-shadow:0 4px 16px rgba(239,68,68,.1)}
.bug-stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}
.bug-stat{background:#fff;border-radius:12px;padding:10px 12px;box-shadow:var(--shadow-sm);border-left:3px solid}
.bug-stat .bval{font-size:22px;font-weight:800}
.bug-stat .blabel{font-size:11px;color:var(--text-3);font-weight:600}
.bug-sidebar-section{padding:6px 8px}
.bug-sidebar-section .stitle{font-size:11px;font-weight:800;color:var(--text-3);text-transform:uppercase;letter-spacing:1px;padding:6px 8px 4px}

/* ============ 移动端抽屉遮罩 ============ */
.sidebar-overlay{position:fixed;inset:0;background:rgba(31,41,51,.45);z-index:19;opacity:0;pointer-events:none;transition:opacity .2s}
.sidebar-overlay.show{opacity:1;pointer-events:auto}
/* 汉堡按钮（仅移动端显示） */
.menu-toggle{display:none;width:34px;height:34px;border-radius:var(--radius-sm);align-items:center;justify-content:center;color:var(--text-2);margin-right:6px;-webkit-tap-highlight-color:transparent}
.menu-toggle:active{background:#f3f4f6}
/* SOP 移动端切换按钮 */
.sop-mobile-tabs{display:none;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:12px}
.sop-mobile-tab{padding:8px;border-radius:var(--radius-sm);background:#fff;border:1px solid var(--border);color:var(--text-2);font-size:13px;font-weight:500;text-align:center;cursor:pointer}
.sop-mobile-tab.active{background:var(--primary);color:#fff;border-color:var(--primary)}

/* ============ 响应式：≤ 768px（手机/小平板） ============ */
@media (max-width:768px){
  :root{--radius:8px}
  body{font-size:14px;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
  /* 顶栏 */
  .topbar{padding:0 10px;height:50px}
  .topbar .logo{margin-right:8px}
  .topbar .logo span{display:none}  /* 隐藏标题文字只留图标 */
  .topbar .logo .logo-icon{width:30px;height:30px}
  .menu-toggle{display:inline-flex}
  .tabs{gap:0}
  .tab{padding:8px 10px;flex:1;justify-content:center}
  .tab span{display:none}  /* tab只显示图标 */
  .tab.active{background:var(--primary-soft)}
  .topbar-actions .badge{font-size:10px;padding:1px 6px}
  .topbar-actions .badge span{display:none}  /* LLM徽章只留图标 */

  /* 主体：单栏，侧栏变抽屉 */
  .main{position:relative}
  .sidebar{position:fixed;top:50px;left:0;bottom:0;width:240px;z-index:20;transform:translateX(-100%);transition:transform .22s ease;box-shadow:var(--shadow-md)}
  .sidebar.open{transform:translateX(0)}
  .sidebar-head{padding:12px 14px 8px}
  .sidebar-list{padding:6px}
  .sidebar-item{padding:10px 12px;font-size:14px}
  .content{padding:14px 12px;flex:1;width:100%}

  /* 待办：标题区 */
  .content h2{font-size:16px}
  .stats-row{grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:14px}
  .stat-card{padding:10px 12px}
  .stat-card .value{font-size:20px}
  .stat-card .label{font-size:10px}
  .stat-card .sub{font-size:10px}
  .todo-toolbar{flex-direction:column;align-items:stretch;gap:8px}
  .todo-toolbar .search{min-width:0}
  .todo-toolbar .search input{padding-left:30px;height:38px}
  .filter-chips{overflow-x:auto;flex-wrap:nowrap;-webkit-overflow-scrolling:touch;padding-bottom:2px}
  .filter-chips::-webkit-scrollbar{display:none}
  .chip{flex-shrink:0;padding:6px 12px;font-size:12px}

  /* 待办项：操作按钮常显（触屏无 hover） */
  .todo-item{padding:11px 12px;gap:10px}
  .todo-actions{opacity:1}
  .todo-actions .icon-btn{width:32px;height:32px}
  .todo-meta{font-size:11px;gap:6px}
  .todo-title{font-size:14px}

  /* 知识库 */
  .knowledge-input{padding:10px}
  .knowledge-input textarea{min-height:70px;font-size:14px}
  .knowledge-input-foot{flex-wrap:wrap;gap:6px}
  .knowledge-grid{grid-template-columns:1fr;gap:10px}
  .k-card{padding:12px}
  .k-card-content{font-size:13px;max-height:160px}
  .k-card .icon-btn{width:32px;height:32px}

  /* 电路/Bug */
  .circuit-thumb{height:140px}
  .circuit-file-card{height:140px}
  .bug-stats-row{grid-template-columns:repeat(2,1fr);gap:8px}
  .bug-images{grid-template-columns:repeat(auto-fill,minmax(70px,1fr))}

  /* SOP：双栏改单栏 + tab 切换 */
  .sop-mobile-tabs{display:grid}
  .sop-layout{grid-template-columns:1fr;height:auto}
  .sop-pane{display:none}
  .sop-pane.mobile-active{display:flex}
  .sop-pane-body{padding:12px}
  .sop-source textarea{min-height:200px;font-size:13px}
  .sop-dropzone{padding:20px 14px}
  .sop-output{font-size:13px}
  .sop-output h1{font-size:18px}
  .sop-output h2{font-size:14px}

  /* 模态弹窗适配 */
  .modal{max-width:calc(100vw - 24px)!important;max-height:88vh}
  .modal-body{padding:16px}
  .field label{font-size:13px}
  .input,.textarea,.select{font-size:15px;height:auto;padding:10px 12px}  /* iOS 避免 <16px 缩放 */
  .select{height:40px}
  .btn{padding:10px 16px;font-size:14px;min-height:40px}

  /* 设置 */
  .settings-section{padding:14px;margin-bottom:12px}
  .kw-editor .kw-cat{padding:8px}

  /* toast 适配 */
  .toast-wrap{top:8px;right:8px;left:8px}
  .toast{max-width:none;font-size:13px}
}

/* ============ 响应式：≤ 380px（小屏手机） ============ */
@media (max-width:380px){
  .stats-row{grid-template-columns:1fr 1fr;gap:6px}
  .stat-card{padding:8px 10px}
  .stat-card .value{font-size:18px}
  .content{padding:12px 10px}
  .todo-item{padding:10px}
}

/* ----------------------- 工具函数 ----------------------- */
const $ = (sel,parent=document)=>parent.querySelector(sel);
const $$ = (sel,parent=document)=>Array.from(parent.querySelectorAll(sel));
const uid = ()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const fmtDate = (d)=>{if(!d)return '';const dt=new Date(d);if(isNaN(dt))return '';const y=dt.getFullYear(),m=String(dt.getMonth()+1).padStart(2,'0'),da=String(dt.getDate()).padStart(2,'0');return `${y}-${m}-${da}`};
const fmtDateTime = (d)=>{if(!d)return '';const dt=new Date(d);if(isNaN(dt))return '';return fmtDate(d)+' '+String(dt.getHours()).padStart(2,'0')+':'+String(dt.getMinutes()).padStart(2,'0')};
const todayStr = ()=>{const d=new Date();return fmtDate(d)};
const daysBetween = (dueDate,today)=>{const p=s=>s.split('-').map(Number);const da=new Date(p(dueDate)[0],p(dueDate)[1]-1,p(dueDate)[2]);const db=new Date(p(today)[0],p(today)[1]-1,p(today)[2]);return Math.round((da-db)/86400000)};
const escapeHtml = (s)=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const escapeAttr = (s)=>escapeHtml(s);
function toast(msg,type='info',ms=2600){
  const emojiMap={success:'✅',error:'❌',warn:'⚠️',info:'💡'};
  const el=document.createElement('div');el.className='toast '+type;el.textContent=(emojiMap[type]||'')+' '+msg;
  $('#toastWrap').appendChild(el);
  setTimeout(()=>{el.style.opacity='0';el.style.transition='opacity .2s';setTimeout(()=>el.remove(),200)},ms);
}
function confirmBox(msg,opts={}){
  return new Promise(res=>{
    const mask=document.createElement('div');mask.className='modal-mask';
    mask.innerHTML=`<div class="modal" style="max-width:400px"><div class="modal-body" style="text-align:center;padding:24px">
      <div style="font-size:14px;color:var(--text);margin-bottom:4px;line-height:1.6">${escapeHtml(msg)}</div>
      ${opts.hint?`<div style="font-size:12px;color:var(--text-3);margin-top:6px">${escapeHtml(opts.hint)}</div>`:''}
      </div><div class="modal-footer">
      <button class="btn btn-ghost" data-act="no">${opts.noText||'取消'}</button>
      <button class="btn ${opts.danger?'btn-danger':'btn-primary'}" data-act="yes">${opts.yesText||'确定'}</button>
      </div></div>`;
    document.body.appendChild(mask);
    mask.addEventListener('click',e=>{
      if(e.target===mask||e.target.dataset.act==='no'){mask.remove();res(false)}
      else if(e.target.dataset.act==='yes'){mask.remove();res(true)}
    });
  });
}
function promptBox(title,opts={}){
  return new Promise(res=>{
    const mask=document.createElement('div');mask.className='modal-mask';
    mask.innerHTML=`<div class="modal" style="max-width:440px">
      <div class="modal-header"><h3 style="font-size:15px">${escapeHtml(title)}</h3></div>
      <div class="modal-body">
        ${opts.fields?opts.fields.map(f=>`<div class="field"><label>${escapeHtml(f.label)}</label>${
          f.type==='select'?
            `<select class="select" id="pf_${f.id}">${(f.options||[]).map(o=>`<option value="${escapeAttr(o.value||o.id||o)}" ${(f.value===(o.value||o.id||o))?'selected':''}>${escapeHtml(o.label||o.name||o)}</option>`).join('')}</select>`
          :f.type==='textarea'?
            `<textarea class="textarea" id="pf_${f.id}" rows="${f.rows||3}">${escapeHtml(f.value||'')}</textarea>`
          :f.type==='checkbox'?
            `<label class="switch"><input type="checkbox" id="pf_${f.id}" ${f.value?'checked':''}><span class="slider"></span></label>`
          :
            `<input class="input" id="pf_${f.id}" type="${f.type||'text'}" value="${escapeAttr(f.value||'')}" ${f.placeholder?`placeholder="${escapeAttr(f.placeholder)}"`:''}/>`
        }${f.hint?`<div class="hint">${escapeHtml(f.hint)}</div>`:''}</div>`).join(''):''}
      </div><div class="modal-footer">
      <button class="btn btn-ghost" data-act="no">取消</button>
      <button class="btn btn-primary" data-act="yes">确定</button></div></div>`;
    document.body.appendChild(mask);
    const firstInput=mask.querySelector('input,textarea');if(firstInput)firstInput.focus();
    mask.addEventListener('click',e=>{
      if(e.target===mask||e.target.dataset.act==='no'){mask.remove();res(null)}
      else if(e.target.dataset.act==='yes'){
        const result={};
        (opts.fields||[]).forEach(f=>result[f.id]=$(('#pf_'+f.id),mask).value);
        mask.remove();res(result);
      }
    });
  });
}

/* ----------------------- 数据层 (IndexedDB) ----------------------- */
const DB={
  db:null,
  async init(){
    return new Promise((resolve,reject)=>{
      const req=indexedDB.open('circuit_workbench',2);
      req.onupgradeneeded=e=>{
        const db=e.target.result;
        if(!db.objectStoreNames.contains('projects'))db.createObjectStore('projects',{keyPath:'id'});
        if(!db.objectStoreNames.contains('todos'))db.createObjectStore('todos',{keyPath:'id'});
        if(!db.objectStoreNames.contains('knowledge'))db.createObjectStore('knowledge',{keyPath:'id'});
        if(!db.objectStoreNames.contains('sops'))db.createObjectStore('sops',{keyPath:'id'});
        if(!db.objectStoreNames.contains('circuits'))db.createObjectStore('circuits',{keyPath:'id'});
        if(!db.objectStoreNames.contains('bugs'))db.createObjectStore('bugs',{keyPath:'id'});
        if(!db.objectStoreNames.contains('meta'))db.createObjectStore('meta',{keyPath:'key'});
      };
      req.onsuccess=e=>{DB.db=e.target.result;resolve()};
      req.onerror=e=>reject(e.target.error);
    });
  },
  _tx(store,mode='readonly'){return DB.db.transaction(store,mode).objectStore(store)},
  async get(store,id){return new Promise((res,rej)=>{const r=DB._tx(store).get(id);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})},
  async all(store){return new Promise((res,rej)=>{const r=DB._tx(store).getAll();r.onsuccess=()=>res(r.result||[]);r.onerror=()=>rej(r.error)})},
  async put(store,obj){return new Promise((res,rej)=>{const r=DB._tx(store,'readwrite').put(obj);r.onsuccess=()=>res(obj);r.onerror=()=>rej(r.error)})},
  async del(store,id){return new Promise((res,rej)=>{const r=DB._tx(store,'readwrite').delete(id);r.onsuccess=()=>res();r.onerror=()=>rej(r.error)})},
  async clear(store){return new Promise((res,rej)=>{const r=DB._tx(store,'readwrite').clear();r.onsuccess=()=>res();r.onerror=()=>rej(r.error)})},
  async getMeta(key){const r=await DB.get('meta',key);return r?r.value:null},
  async setMeta(key,value){return DB.put('meta',{key,value})},
};

let _manifestBlobUrl=null;
function applyDynamicManifest(){
  const name=Config.get('workbenchName')||'工程师工作台';
  const manifest={
    name:name,
    short_name:name.length>8?name.slice(0,8):name,
    description:'服务器硬件电路工程师的个人工作台',
    start_url:'./',
    scope:'./',
    display:'standalone',
    orientation:'portrait',
    background_color:'#d4f5e9',
    theme_color:'#86efac',
    lang:'zh-CN',
    icons:[
      {src:'assets/icon-192.png',sizes:'192x192',type:'image/png',purpose:'any maskable'},
      {src:'assets/icon-512.png',sizes:'512x512',type:'image/png',purpose:'any maskable'},
      {src:'assets/icon-180.png',sizes:'180x180',type:'image/png',purpose:'any'}
    ]
  };
  const blob=new Blob([JSON.stringify(manifest)],{type:'application/manifest+json'});
  if(_manifestBlobUrl)URL.revokeObjectURL(_manifestBlobUrl);
  _manifestBlobUrl=URL.createObjectURL(blob);
  let link=document.querySelector('link[rel="manifest"]');
  if(!link){link=document.createElement('link');link.rel='manifest';document.head.appendChild(link);}
  link.href=_manifestBlobUrl;
  // 同步 apple-mobile-web-app-title（iOS 桌面图标名）
  let meta=document.querySelector('meta[name="apple-mobile-web-app-title"]');
  if(meta)meta.content=name;
}

/* ----------------------- LLM 调用层 ----------------------- */
const LLM={
  isAvailable(){return Config.get('llmEnabled')&&Config.get('baseUrl')&&Config.get('apiKey')},
  /* 智能拼接 chat/completions 完整端点 */
  buildUrl(baseUrl){
    let u=baseUrl.replace(/\/+$/,''); // 去尾部斜杠
    if(u.includes('/chat/completions'))return u; // 已是完整路径
    if(/\/v\d+\/?$/.test(u))return u.replace(/\/+$/,'')+'/chat/completions'; // 已含 /v1 结尾
    if(u.includes('/v1/')||u.includes('/v2/'))return u+'/chat/completions'; // 路径中间已含版本号
    return u+'/v1/chat/completions'; // 默认追加
  },
  async chat(messages,opts={}){
    if(!LLM.isAvailable())throw new Error('LLM未启用或未配置');
    const url=LLM.buildUrl(Config.get('baseUrl'));
    const body={model:Config.get('model'),messages,temperature:opts.temperature??0.3,stream:false};
    if(opts.maxTokens)body.max_tokens=opts.maxTokens;
    let resp;
    try{
      resp=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+Config.get('apiKey')},body:JSON.stringify(body)});
    }catch(netErr){
      throw new Error('网络请求失败（可能是CORS跨域拦截或网络不通）：'+netErr.message);
    }
    if(!resp.ok){const t=await resp.text().catch(()=>resp.statusText);throw new Error(`LLM请求失败 (${resp.status}): ${t.slice(0,200)}`)}
    const data=await resp.json();
    return data.choices?.[0]?.message?.content||'';
  },
};

function matchKeyword(lower,kw){
  const kwl=kw.toLowerCase();
  if(kwl.length<=2&&/^[a-z0-9]+$/.test(kwl)){
    return new RegExp('(?<![a-z0-9])'+kwl.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'(?![a-z0-9])').test(lower)?2:0;
  }
  const cnt=lower.split(kwl).length-1;
  return cnt>0?cnt*2:0;
}

    if(c.id==='bother')return;
    let s=0;
    c.keywords.forEach(kw=>{s+=matchKeyword(lower,kw)});
    scores[c.id]=s;
  });
  let best='bother',bestScore=0;
  Object.entries(scores).forEach(([k,v])=>{if(v>bestScore){bestScore=v;best=k}});
  // 严重程度
  let sev='normal',sevScore=0;
  SEVERITIES.forEach(s=>{
    if(s.id==='normal')return;
    let s2=0;
    s.keywords.forEach(kw=>{s2+=matchKeyword(lower,kw)});
    if(s2>sevScore){sevScore=s2;sev=s.id}
  });
  const sorted=Object.entries(scores).filter(([,v])=>v>0).sort((a,b)=>b[1]-a[1]);
  const uncertain=bestScore===0||(sorted.length>=2&&(sorted[0][1]-sorted[1][1])<=1);
  return {cat:best,severity:sev,uncertain};
}

  }

    if(a.status!==b.status){const so={in_progress:0,pending:1,blocked:2,done:3};return so[a.status]-so[b.status]}
    if(prioOrder[a.priority]!==prioOrder[b.priority])return prioOrder[a.priority]-prioOrder[b.priority];
    if(a.dueDate&&b.dueDate)return a.dueDate.localeCompare(b.dueDate);
    if(a.dueDate)return-1;if(b.dueDate)return 1;
    return 0;
  });

  // 统计
  const allForStat=pid==='today'?State.todos.filter(t=>t.status!=='done'&&(t.dueDate===todayStr()||t.status==='in_progress')):(pid==='all'?State.todos:State.todos.filter(t=>t.projectId===pid));

  const projectDone=pid!=='today'&&pid!=='all'?State.todos.filter(t=>t.projectId===pid&&t.status==='done').length:0;

    <div style="display:flex;align-items:center;gap:10px;margin-bottom:18px">

        <h2 style="font-size:18px;font-weight:800;letter-spacing:-.3px">${titleEmoji} ${escapeHtml(title)}</h2>
        <div style="font-size:12px;color:var(--text-3)">${pid!=='today'&&pid!=='all'&&projectTotal?`完成 ${projectDone}/${projectTotal} · 进度 ${pct}%`:pid==='today'?'今日需完成 + 进行中的任务':'所有未完成任务'}</div>
      </div>
      ${pid!=='today'&&pid!=='all'&&pid!=='all'?`<button class="btn btn-primary btn-sm" id="addTodoBtn">${svg(ICONS.plus,14)} 新建任务</button>`:pid==='all'?'':`<button class="btn btn-primary btn-sm" id="addTodoBtn">${svg(ICONS.plus,14)} 新建任务</button>`}
    </div>
    ${(pid!=='today'&&pid!=='all')&&projectTotal?`<div style="margin-bottom:16px"><div class="progress-bar"><div style="width:${pct}%;background:${(State.projects.find(p=>p.id===pid)||{}).color||'var(--primary)'}"></div></div></div>`:''}
    <div class="stats-row">
      <div class="stat-card todo"><div class="label">📋 待办</div><div class="value primary">${total-done}</div><div class="sub">进行中 ${allForStat.filter(t=>t.status==='in_progress').length}</div></div>
      <div class="stat-card done"><div class="label">✅ 今日完成</div><div class="value success">${todayDone}</div><div class="sub">本周 ${doneThisWeek}</div></div>
      <div class="stat-card overdue"><div class="label">🔥 逾期</div><div class="value ${overdue?'danger':''}">${overdue}</div><div class="sub">需立即处理</div></div>

    </div>
    <div class="todo-toolbar">
      <div class="search">
        ${svg(ICONS.search,15)}
        <input class="input" id="todoSearch" placeholder="搜索任务..." value="${escapeAttr(State.todoSearch)}">
      </div>
      <div class="filter-chips">
        ${[['all','全部'],['pending','待办'],['in_progress','进行中'],['blocked','阻塞'],['done','已完成']].map(([k,l])=>`<div class="chip ${State.todoFilter===k?'active':''}" data-f="${k}">${l}</div>`).join('')}
      </div>
    </div>
    <div class="todo-list" id="todoList">
      ${displayTodos.length===0?`<div class="empty-state"><div class="emoji">🎉</div><h3>暂无任务</h3><p>${pid==='today'?'今日无待办，可以摸鱼了 ☕':'点击右上角新建任务'}</p></div>`:displayTodos.map(t=>renderTodoItem(t)).join('')}
    </div>`;
  main.appendChild(content);

  // 事件绑定
  sidebar.querySelectorAll('.sidebar-item').forEach(el=>el.onclick=()=>{State.currentProjectId=el.dataset.pid;renderMain();closeSidebar()});
  $('#newProjectBtn').onclick=newProject;
  const addBtn=$('#addTodoBtn');if(addBtn)addBtn.onclick=()=>editTodo(null);
  const searchInput=$('#todoSearch');
  if(searchInput){let timer;searchInput.oninput=e=>{clearTimeout(timer);timer=setTimeout(()=>{State.todoSearch=e.target.value;renderMain();const i=$('#todoSearch');if(i){i.focus();i.setSelectionRange(i.value.length,i.value.length)}},250)}}
  $$('.chip').forEach(c=>c.onclick=()=>{State.todoFilter=c.dataset.f;renderMain()});
  $$('.todo-item').forEach(el=>{
    const tid=el.dataset.tid;
    el.querySelector('.todo-check').onclick=()=>toggleTodoStatus(tid);
    el.querySelector('[data-act="edit"]').onclick=()=>editTodo(tid);
    el.querySelector('[data-act="del"]').onclick=()=>deleteTodo(tid);
    const cyc=el.querySelector('[data-act="cycle"]');if(cyc)cyc.onclick=()=>cycleTodoStatus(tid);
  });
}

function renderTodoItem(t){
  const proj=State.projects.find(p=>p.id===t.projectId);
  const isOverdue=t.status!=='done'&&t.dueDate&&daysBetween(t.dueDate,todayStr())<0;
  const dueTag=t.dueDate?(()=>{
    const d=daysBetween(t.dueDate,todayStr());
    if(d<0)return `<span class="due-tag overdue">${svg(ICONS.alert,10)}逾期${-d}天</span>`;
    if(d===0)return `<span class="due-tag today">今天到期</span>`;
    if(d<=3)return `<span class="due-tag soon">${d}天后</span>`;
    return `<span class="due-tag">${fmtDate(t.dueDate)}</span>`;
  })():'';
  const statusBadge={
    pending:'',in_progress:`<span class="badge" style="background:var(--warn-soft);color:var(--warn)">▶️ 进行中</span>`,
    done:`<span class="badge" style="background:var(--success-soft);color:var(--success)">✅ 已完成</span>`,
    blocked:`<span class="badge" style="background:var(--danger-soft);color:var(--danger)">🚧 阻塞</span>`,
  }[t.status];
  const prioFlag=`<span class="priority-flag ${t.priority||'medium'}" title="${({high:'高',medium:'中',low:'低'})[t.priority||'medium']}优先级">${svg(ICONS.flag,11)}</span>`;
  return `<div class="todo-item ${t.status==='done'?'done':''} ${isOverdue?'overdue':''}" data-tid="${t.id}">
    <div class="todo-check" title="切换完成">${t.status==='done'?svg(ICONS.check,11):''}</div>
    <div class="todo-body">
      <div class="todo-title">${escapeHtml(t.title)}</div>
      ${t.detail?`<div style="font-size:12px;color:var(--text-3);margin-top:3px;white-space:pre-wrap">${escapeHtml(t.detail)}</div>`:''}
      <div class="todo-meta">
        ${prioFlag}
        ${proj?`<span class="proj"><span class="dot" style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${proj.color}"></span>${escapeHtml(proj.name)}</span>`:''}
        ${dueTag}
        ${statusBadge}
        ${t.completedAt?`<span title="完成时间">${svg(ICONS.check,10)}${fmtDate(t.completedAt)}</span>`:''}
        ${t.blockedReason?`<span style="color:var(--danger)">${svg(ICONS.alert,10)}${escapeHtml(t.blockedReason)}</span>`:''}
      </div>
      ${t.blockedReason&&t.status==='blocked'?`<div class="blocked-reason">${svg(ICONS.alert,12)}阻塞原因：${escapeHtml(t.blockedReason)}</div>`:''}
    </div>
    <div class="todo-actions">
      <button class="icon-btn" data-act="cycle" title="切换状态">${svg(ICONS.refresh,14)}</button>
      <button class="icon-btn" data-act="edit" title="编辑">${svg(ICONS.edit,14)}</button>
      <button class="icon-btn" data-act="del" title="删除">${svg(ICONS.trash,14)}</button>
    </div>
  </div>`;
}

async function newProject(){
  const res=await promptBox('新建项目',{
    fields:[
      {id:'name',label:'项目名称',placeholder:'如：X12服务器主板v2'},
      {id:'description',label:'项目描述',type:'textarea',rows:2,placeholder:'可选'},
    ]
  });
  if(!res||!res.name.trim())return;
  const color=PROJECT_COLORS[State.projects.length%PROJECT_COLORS.length];
  const proj={id:uid(),name:res.name.trim(),description:res.description||'',color,createdAt:Date.now(),archived:false};
  await DB.put('projects',proj);
  State.projects.push(proj);
  State.currentProjectId=proj.id;
  toast('项目已创建','success');
  renderMain();
}

async function editTodo(id){
  const todo=id?State.todos.find(t=>t.id===id):null;
  const isNew=!todo;
  if(newTodoNeedsProject()){}
  // 选项目（新建时若在今日/全部视图，需选项目）
  const projectOptions=State.projects.map(p=>({id:p.id,name:p.name}));
  if(projectOptions.length===0){toast('请先创建一个项目','warn');newProject();return}
  const defaultPid=todo?todo.projectId:(State.currentProjectId&&State.currentProjectId!=='today'&&State.currentProjectId!=='all'?State.currentProjectId:projectOptions[0].id);
  const res=await promptBox(isNew?'新建任务':'编辑任务',{
    fields:[
      {id:'title',label:'任务标题',value:todo?todo.title:'',placeholder:'如：完成CPU供电VRM调试'},
      {id:'detail',label:'任务详情',type:'textarea',rows:3,value:todo?todo.detail||'':''},
      {id:'projectId',label:'所属项目',type:'select',value:defaultPid,options:projectOptions.map(p=>({value:p.id,label:p.name}))},
      {id:'priority',label:'优先级',type:'select',value:todo?todo.priority||'medium':'medium',options:[{value:'high',label:'高'},{value:'medium',label:'中'},{value:'low',label:'低'}]},
      {id:'dueDate',label:'完成期限',type:'date',value:todo?todo.dueDate||'':''},
      ...(todo?[{id:'blockedReason',label:'阻塞原因（仅阻塞状态时显示）',value:todo.blockedReason||'',placeholder:'如：等待BGA返板'}]:[]),
    ]
  });
  // 自定义select渲染（promptBox默认是input，需要改造）。这里简化：用原生prompt补充。实际我们扩展promptBox支持select。
  if(res===null)return;
  // 由于promptBox对select支持有限，这里做兼容处理
  const obj={
    id:todo?todo.id:uid(),
    title:res.title.trim(),
    detail:res.detail||'',
    projectId:res.projectId,
    priority:res.priority,
    dueDate:res.dueDate||null,
    status:todo?todo.status:'pending',
    createdAt:todo?todo.createdAt:Date.now(),
    completedAt:todo?todo.completedAt:null,
    blockedReason:res.blockedReason||null,
  };
  await DB.put('todos',obj);
  if(isNew)State.todos.push(obj);else{const i=State.todos.findIndex(t=>t.id===id);if(i>=0)State.todos[i]=obj}
  toast(isNew?'任务已创建':'任务已更新','success');
  renderMain();
}

async function toggleTodoStatus(id){
  const t=State.todos.find(x=>x.id===id);if(!t)return;
  if(t.status==='done'){
    t.status='pending';t.completedAt=null;
  }else{
    t.status='done';t.completedAt=Date.now();
  }
  await DB.put('todos',t);
  renderMain();
}
async function cycleTodoStatus(id){
  const t=State.todos.find(x=>x.id===id);if(!t)return;
  const order=['pending','in_progress','blocked','done'];
  const i=order.indexOf(t.status);
  t.status=order[(i+1)%order.length];
  if(t.status==='done')t.completedAt=Date.now();else t.completedAt=null;
  if(t.status==='blocked'&&!t.blockedReason){const r=prompt('请输入阻塞原因：');if(r)t.blockedReason=r;else{toast('已设为阻塞','warn')}}
  await DB.put('todos',t);
  renderMain();
}
async function deleteTodo(id){
  if(!await confirmBox('确定删除此任务？',{danger:true}))return;
  await DB.del('todos',id);
  State.todos=State.todos.filter(t=>t.id!==id);
  toast('已删除','success');
  renderMain();
}
function newTodoNeedsProject(){return false}

  return `<div class="k-card" data-kid="${k.id}">

async function saveKnowledge(useAI=false){
  const ta=$('#kwInput');const text=ta.value.trim();
  if(!text){toast('请输入内容','warn');return}
  const result=classifyKnowledge(text);
  const k={id:uid(),content:text,source:'manual',category:result.cat,tags:[],createdAt:Date.now(),updatedAt:Date.now(),summary:null};
  await DB.put('knowledge',k);
  State.knowledge.push(k);
  ta.value='';
  toast(`已保存，自动归类为「${CAT_MAP[result.cat].name}」${result.uncertain?'（建议确认）':''}`,'success');
  if(useAI&&LLM.isAvailable()){aiSummaryKnowledge(k.id)}
  renderMain();
}

async function deleteKnowledge(id){
  if(!await confirmBox('删除此条知识？',{danger:true}))return;
  await DB.del('knowledge',id);
  State.knowledge=State.knowledge.filter(k=>k.id!==id);
  toast('已删除','success');
  renderMain();
}

async function editKnowledge(id){
  const k=State.knowledge.find(x=>x.id===id);if(!k)return;
  const res=await promptBox('编辑知识',{fields:[{id:'content',label:'内容',type:'textarea',rows:6,value:k.content}]});
  if(res===null)return;
  k.content=res.content;k.updatedAt=Date.now();
  await DB.put('knowledge',k);
  toast('已更新','success');
  renderMain();
}

async function changeKnowledgeCategory(id){
  const k=State.knowledge.find(x=>x.id===id);if(!k)return;
  const mask=document.createElement('div');mask.className='modal-mask';
  mask.innerHTML=`<div class="modal" style="max-width:400px"><div class="modal-header"><h3 style="font-size:15px">选择分类</h3></div>
    <div class="modal-body" style="display:grid;grid-template-columns:1fr 1fr;gap:6px">
      ${CATEGORIES.map(c=>`<button class="btn ${k.category===c.id?'btn-primary':'btn-ghost'}" data-c="${c.id}" style="justify-content:flex-start"><span class="dot" style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${c.color};margin-right:6px"></span>${escapeHtml(c.name)}</button>`).join('')}
    </div></div>`;
  document.body.appendChild(mask);
  mask.addEventListener('click',async e=>{
    if(e.target===mask){mask.remove()}
    else if(e.target.dataset.c){k.category=e.target.dataset.c;k.updatedAt=Date.now();await DB.put('knowledge',k);mask.remove();toast('分类已更新','success');renderMain()}

}

async function aiSummaryKnowledge(id){
  if(!LLM.isAvailable()){toast('请先在设置中配置LLM','warn');return}
  const k=State.knowledge.find(x=>x.id===id);if(!k)return;
  toast('正在生成摘要...','info',4000);
  try{
    const sys='你是服务器硬件电路工程领域的知识助手。请用1-2句话精炼总结以下知识点的核心要点，并给出1-3个标签（用逗号分隔）。输出格式：第一行摘要，第二行"标签:tag1,tag2"';
    const user=k.content;
    const resp=await LLM.chat([{role:'system',content:sys},{role:'user',content:user}]);
    const lines=resp.trim().split('\n');
    let summary=resp,tags=k.tags||[];
    const tagLine=lines.find(l=>l.trim().startsWith('标签'));
    if(tagLine){summary=lines.filter(l=>!l.trim().startsWith('标签')).join('\n').trim();tags=tagLine.split(':')[1].split(',').map(s=>s.trim()).filter(Boolean)}
    k.summary=summary;k.tags=tags;k.updatedAt=Date.now();
    await DB.put('knowledge',k);
    toast('摘要已生成','success');
    renderMain();
  }catch(e){toast('生成失败：'+e.message,'error',4000)}
}

async function batchSummary(){
  if(!LLM.isAvailable())return;
  const cat=State.kwCategoryFilter;
  const list=cat==='all'?State.knowledge:State.knowledge.filter(k=>k.category===cat);
  if(list.length===0){toast('该分类暂无知识','warn');return}
  if(list.length>30){toast('数量较多，将只总结前30条','warn')}
  toast('正在生成综述...','info',5000);
  try{
    const catName=cat==='all'?'全部':CAT_MAP[cat].name;
    const content=list.slice(0,30).map((k,i)=>`[${i+1}] ${k.content.slice(0,200)}`).join('\n');
    const sys=`你是服务器硬件电路工程领域专家。请对以下${catName}类知识点进行综述总结：提炼共性主题、指出关键要点、发现潜在关联。输出300字以内的结构化综述。`;
    const resp=await LLM.chat([{role:'system',content:sys},{role:'user',content:content}]);
    // 存为一条新知识
    const k={id:uid(),content:`【${catName}综述 · ${fmtDate(Date.now())}】\n\n${resp}`,source:'ai',category:cat==='all'?'other':cat,tags:['综述'],createdAt:Date.now(),updatedAt:Date.now(),summary:'AI生成的分类综述'};
    await DB.put('knowledge',k);
    State.knowledge.push(k);
    toast('综述已生成并保存','success');
    renderMain();
  }catch(e){toast('生成失败：'+e.message,'error',4000)}
}

async function exportKnowledge(){
  const byCat={};
  State.knowledge.forEach(k=>{(byCat[k.category]=byCat[k.category]||[]).push(k)});
  let md='# 知识库导出\n\n导出时间：'+fmtDateTime(Date.now())+'\n\n';
  CATEGORIES.forEach(c=>{
    const list=byCat[c.id]||[];if(list.length===0)return;
    md+=`## ${c.name}（${list.length}条）\n\n`;
    list.forEach((k,i)=>{md+=`### ${i+1}. ${k.content.slice(0,40).replace(/\n/g,' ')}${k.content.length>40?'...':''}\n\n${k.content}\n\n${k.summary?`> **摘要**：${k.summary}\n\n`:''}${(k.tags&&k.tags.length)?`标签：${k.tags.join(', ')}\n\n`:''}---\n\n`});
  });
  const blob=new Blob([md],{type:'text/markdown'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`知识库_${todayStr()}.md`;a.click();
  toast('已导出','success');
}

let _circuitPending=null;
async function handleCircuitFile(file){
  if(file.size>8*1024*1024){toast('文件超过8MB限制','error');return}
  const ext=file.name.split('.').pop().toLowerCase();
  const isImage=/^(png|jpe?g|gif|webp|bmp|svg)$/.test(ext);
  _circuitPending={file,ext,isImage,name:file.name};
  // 预填名称
  const nameInput=$('#circuitName');
  if(nameInput&&!nameInput.value)nameInput.value=file.name.replace(/\.[^.]+$/,'');
  toast(`已选择 ${file.name}，点击保存按钮上传`,'info');
  // 图片直接预览
  if(isImage){
    const reader=new FileReader();
    reader.onload=()=>{_circuitPending.dataUrl=reader.result;toast('图片已就绪','success')};
    reader.readAsDataURL(file);
  }
}

async function saveCircuit(){
  if(!_circuitPending||!_circuitPending.file){toast('请先选择文件','warn');return}
  const name=($('#circuitName').value||_circuitPending.name).trim();
  const note=$('#circuitNote').value.trim();
  const p=_circuitPending;
  let fileType,fileData='',textContent='',thumbUrl='';
  try{
    if(p.isImage){
      fileType='image';
      if(!p.dataUrl){const b=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(p.file)});p.dataUrl=b}
      fileData=p.dataUrl;thumbUrl=p.dataUrl;
    }else if(['cpm','txt','md','markdown'].includes(p.ext)){
      fileType=p.ext==='cpm'?'cpm':'text';
      try{
        textContent=await p.file.text();
        if(textContent.length>20000)textContent=textContent.slice(0,20000)+'\n...(内容过长已截断)';
        fileData=textContent;
      }catch(e){toast('文件读取失败，仅保存文件名','warn');textContent=''}
    }else{
      toast('不支持的文件类型：'+p.ext,'error');return;
    }
    // 自动分类
    const classifyInput=[name,note,textContent,p.name].join(' ');
    const result=classifyCircuit(classifyInput);
    const obj={id:uid(),name,note,category:result.cat,fileType,fileName:p.name,fileData,textContent,thumbUrl,tags:[],createdAt:Date.now(),updatedAt:Date.now()};
    await DB.put('circuits',obj);
    State.circuits.push(obj);
    _circuitPending=null;

async function aiSummaryBug(id){
  if(!LLM.isAvailable()){toast('请先在设置中配置LLM','warn');return}
  const b=State.bugs.find(x=>x.id===id);if(!b)return;
  toast('正在生成摘要...','info',4000);
  try{
    const sys='你是服务器硬件电路工程领域的Bug分析助手。请用1-2句话精炼总结以下Bug的核心问题、根因和解决方案，并给出1-3个标签（逗号分隔）。输出格式：第一行摘要，第二行"标签:tag1,tag2"';
    const user=`标题：${b.title}\n内容：${b.content||''}`;
    const resp=await LLM.chat([{role:'system',content:sys},{role:'user',content:user}]);
    const lines=resp.trim().split('\n');
    let summary=resp,tags=b.tags||[];
    const tagLine=lines.find(l=>l.trim().startsWith('标签'));
    if(tagLine){summary=lines.filter(l=>!l.trim().startsWith('标签')).join('\n').trim();tags=tagLine.split(':')[1].split(',').map(s=>s.trim()).filter(Boolean)}
    b.summary=summary;b.tags=tags;b.updatedAt=Date.now();
    await DB.put('bugs',b);
    toast('摘要已生成','success');
    renderMain();
  }catch(e){toast('生成失败：'+e.message,'error',4000)}
}

    md+=`## ${c.emoji} ${c.name}（${list.length}条）\n\n`;
    list.forEach((b,i)=>{

      md+=`### ${i+1}. [${sev.emoji}${sev.name}] ${b.title}\n\n`;
      if(b.content)md+=`${b.content}\n\n`;
      md+=`- 严重程度：${sev.name}\n- 记录日期：${fmtDate(b.createdAt)}\n`;
      if(b.summary)md+=`- **摘要**：${b.summary}\n`;
      md+='\n---\n\n';
    });
  });
  const blob=new Blob([md],{type:'text/markdown'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`Bug汇总_${todayStr()}.md`;a.click();
  toast('已导出','success');
}

async function parseSopFile(file){
  if(file.size>20*1024*1024){toast('文件超过20MB限制','error');return}
  const ext=file.name.split('.').pop().toLowerCase();
  toast('正在解析文件...','info',4000);
  try{
    let text='';
    if(ext==='pdf'){
      const ab=await file.arrayBuffer();
      const pdf=await pdfjsLib.getDocument({data:ab}).promise;
      for(let i=1;i<=pdf.numPages;i++){const page=await pdf.getPage(i);const vc=await page.getTextContent();text+=vc.items.map(it=>it.str).join(' ')+'\n\n'}
    }else if(ext==='docx'){
      const ab=await file.arrayBuffer();
      const result=await mammoth.extractRawText({arrayBuffer:ab});
      text=result.value;
    }else if(['md','txt','csv','markdown'].includes(ext)){
      text=await file.text();
    }else{
      toast('不支持的文件类型：'+ext,'error');return;
    }
    State.sopSourceText=text;
    $('#sopText').value=text;
    toast(`已解析 ${file.name}（${text.length}字符）`,'success');
  }catch(e){toast('解析失败：'+e.message,'error',5000)}
}

function generateSopLocal(){
  const text=State.sopSourceText||$('#sopText').value;
  if(!text.trim()){toast('请先输入或上传文本','warn');return}
  // 本地规则：识别标题、步骤、注意事项、参考
  const lines=text.split('\n').map(l=>l.trim()).filter(Boolean);
  const title=lines.find(l=>/^#{1,3}\s/.test(l))?.replace(/^#+\s/,'')||lines[0].slice(0,40);
  // 步骤识别：含数字开头、"步骤"、"第x步"
  const steps=[];const notes=[];const refs=[];
  let cur=null;
  lines.forEach(l=>{
    if(/^(\d+[.、)]|步骤|第.?[一二三四五六七八九十\d]+步|step\s*\d)/i.test(l)){steps.push(l.replace(/^(\d+[.、)]|步骤|第.?[一二三四五六七八九十\d]+步|step\s*\d[:：.\s]*)/i,'').trim())}
    else if(/(注意|警告|小心|caution|warning|注意：)/i.test(l)){notes.push(l.replace(/^(注意|警告|小心|caution|warning|注意：)[:：]?\s*/i,'').trim())}
    else if(/(参考|引用|参见|reference|ref[:：])/i.test(l)){refs.push(l.replace(/^(参考|引用|参见|reference|ref)[:：]?\s*/i,'').trim())}
  });
  // 若未识别到步骤，按段落拆分
  let finalSteps=steps;
  if(finalSteps.length===0){finalSteps=text.split(/\n\s*\n/).map(p=>p.trim()).filter(p=>p.length>5).slice(0,12)}
  const md=buildSopMarkdown({
    title:title||'工作流程SOP',
    purpose:`本SOP基于输入资料整理，规范${title||'该'}工作的操作流程，确保操作一致性与质量。`,
    scope:'适用于服务器硬件电路相关工程操作。',
    tools:'（根据资料补充：示波器、万用表、焊接工具、相关治具等）',
    steps:finalSteps,
    checks:'（根据资料补充：每步完成后的质量检查点）',
    notes:notes.length?notes:['（根据资料补充：操作注意事项）'],
    refs:refs.length?refs:[],
    source:'本地规则整理',
  });
  State.sopOutputMd=md;
  $('#sopOutput').innerHTML=marked.parse(md);
  toast('已整理为SOP（本地规则模式）','success');
  sopSwitchToOutput();
}

async function generateSopAI(){
  if(!LLM.isAvailable()){toast('请先在设置中启用LLM','warn');return}
  const text=State.sopSourceText||$('#sopText').value;
  if(!text.trim()){toast('请先输入或上传文本','warn');return}
  toast('AI正在整理SOP，请稍候...','info',8000);
  try{
    const sys=`你是服务器硬件电路工程领域的SOP编写专家。请将用户提供的资料整理为标准作业流程(SOP)。
输出严格的Markdown格式，包含以下章节（缺信息处留"（资料未提及，建议补充）"）：
# {SOP标题}
## 目的
## 适用范围
## 工具与材料
## 操作步骤
（用有序列表，每步清晰可执行）
## 质量检查点
## 注意事项
## 参考文档
保持专业、简洁、可操作。步骤要具体到可执行层面。`;
    const resp=await LLM.chat([{role:'system',content:sys},{role:'user',content:'请整理以下资料为SOP：\n\n'+text.slice(0,8000)}],{maxTokens:3000});
    State.sopOutputMd=resp;
    $('#sopOutput').innerHTML=marked.parse(resp);
    toast('AI已整理完成','success');
    sopSwitchToOutput();
  }catch(e){toast('整理失败：'+e.message,'error',5000)}
}

function buildSopMarkdown(o){
  let md=`# ${o.title}\n\n`;
  md+=`> 版本：v1.0 ｜ 整理日期：${fmtDate(Date.now())} ｜ 来源：${o.source}\n\n`;
  md+=`## 目的\n${o.purpose}\n\n`;
  md+=`## 适用范围\n${o.scope}\n\n`;
  md+=`## 工具与材料\n${o.tools}\n\n`;
  md+=`## 操作步骤\n`;
  if(o.steps.length){o.steps.forEach((s,i)=>{md+=`${i+1}. ${s}\n`})}
  else{md+='（资料未提及，建议补充）\n'}
  md+='\n## 质量检查点\n'+o.checks+'\n\n';
  md+='## 注意事项\n';
  if(o.notes.length){o.notes.forEach(n=>{md+=`- ${n}\n`})}
  else{md+='（资料未提及，建议补充）\n'}
  if(o.refs.length){md+='\n## 参考文档\n';o.refs.forEach(r=>{md+=`- ${r}\n`})}
  return md;
}

async function showSopHistory(){
  if(State.sops.length===0){toast('暂无历史SOP','warn');return}
  const mask=document.createElement('div');mask.className='modal-mask';
  mask.innerHTML=`<div class="modal" style="max-width:560px;max-height:80vh"><div class="modal-header"><h3 style="font-size:15px">历史SOP（${State.sops.length}）</h3></div>
    <div class="modal-body" style="padding:12px">
      ${State.sops.sort((a,b)=>b.createdAt-a.createdAt).map(s=>`<div class="sop-history-item" data-id="${s.id}"><div><div style="font-weight:500">${escapeHtml(s.title)}</div><div style="font-size:11px;color:var(--text-3)">${fmtDateTime(s.createdAt)}</div></div><div style="display:flex;gap:4px"><button class="icon-btn" data-act="load" data-id="${s.id}" title="载入">${svg(ICONS.refresh,13)}</button><button class="icon-btn" data-act="del" data-id="${s.id}" title="删除" style="color:var(--danger)">${svg(ICONS.trash,13)}</button></div></div>`).join('')}
    </div>
    <div class="modal-footer"><button class="btn btn-ghost" data-act="close">关闭</button></div></div>`;
  document.body.appendChild(mask);
  mask.addEventListener('click',async e=>{
    if(e.target===mask||e.target.dataset.act==='close'){mask.remove();return}
    const id=e.target.dataset.id||e.target.closest('[data-id]')?.dataset.id;
    if(!id)return;
    const act=e.target.dataset.act;
    if(act==='load'){const s=State.sops.find(x=>x.id===id);if(s){State.sopOutputMd=s.content;mask.remove();renderMain();toast('已载入','success')}}
    else if(act==='del'){await DB.del('sops',id);State.sops=State.sops.filter(x=>x.id!==id);mask.remove();toast('已删除','success');showSopHistory()}
  });
}

            <div class="kw-cat-head"><span class="dot" style="background:${c.color}"></span>${c.emoji} ${c.name} <span style="color:var(--text-3);font-weight:400">· ${c.keywords.length}个关键词</span></div>
            <div style="font-size:11px;color:var(--text-3);line-height:1.6">${c.keywords.slice(0,16).map(k=>`<span class="tag">${escapeHtml(k)}</span>`).join('')}</div>
          </div>`).join('')}
        </div>
      </div>

      <div class="settings-section">
        <h3>🐛 Bug 分类体系</h3>
        <div class="desc">Bug汇总模块使用，按类型+严重程度双维度分类。</div>
        <div style="margin-bottom:10px;font-size:12px;font-weight:700;color:var(--text-2)">按类型</div>
        <div class="kw-editor">
          ${BUG_CATEGORIES.filter(c=>c.id!=='bother').map(c=>`<div class="kw-cat">
            <div class="kw-cat-head"><span class="dot" style="background:${c.color}"></span>${c.emoji} ${c.name} <span style="color:var(--text-3);font-weight:400">· ${c.keywords.length}个关键词</span></div>
            <div style="font-size:11px;color:var(--text-3);line-height:1.6">${c.keywords.slice(0,16).map(k=>`<span class="tag">${escapeHtml(k)}</span>`).join('')}</div>
          </div>`).join('')}
        </div>
        <div style="margin:14px 0 10px;font-size:12px;font-weight:700;color:var(--text-2)">按严重程度</div>
        <div style="display:flex;gap:8px;flex-wrap:wrap">
          ${SEVERITIES.map(s=>`<span class="badge" style="background:${s.color}20;color:${s.color};padding:6px 12px;font-size:12px">${s.emoji} ${s.name}</span>`).join('')}
        </div>
      </div>
    </div>`;

  $('#saveNameBtn').onclick=async()=>{
    const name=$('#workbenchName').value.trim()||'工程师工作台';
    Config.data.workbenchName=name;
    await Config.save();
    document.title='🔌 '+name;
    applyDynamicManifest();
    renderTopbar();renderMain();
    toast('名称已更新！如果已安装应用，需卸载重装才能让桌面图标名生效','success',5000);
  };
  $('#saveLlmBtn').onclick=async()=>{
    Config.data.llmEnabled=$('#llmEnabled').checked;
    Config.data.baseUrl=$('#baseUrl').value.trim();
    Config.data.apiKey=$('#apiKey').value.trim();
    Config.data.model=$('#model').value.trim()||'gpt-4o-mini';
    await Config.save();
    toast('配置已保存','success');
    renderTopbar();renderMain();
  };
  $('#testLlmBtn').onclick=async()=>{
    const btn=$('#testLlmBtn');const old=btn.innerHTML;btn.innerHTML='<span class="spinner"></span>测试中';btn.disabled=true;
    Config.data.llmEnabled=true;Config.data.baseUrl=$('#baseUrl').value.trim();Config.data.apiKey=$('#apiKey').value.trim();Config.data.model=$('#model').value.trim();
    await Config.save();
    try{
      const r=await LLM.chat([{role:'user',content:'回复"OK"两个字'}],{maxTokens:10});
      toast('连接成功：'+r.slice(0,30),'success');
    }catch(e){toast('连接失败：'+e.message,'error',5000)}
    btn.innerHTML=old;btn.disabled=false;
  };
  $('#exportBtn').onclick=exportAllData;
  $('#importBtn').onclick=()=>$('#importFile').click();
  $('#importFile').onchange=importAllData;
  $('#clearBtn').onclick=clearAllData;
  // 检查更新
  $('#checkUpdateBtn').onclick=async()=>{
    const btn=$('#checkUpdateBtn');const status=$('#updateStatus');
    const old=btn.innerHTML;btn.innerHTML='<span class="spinner"></span>检查中';btn.disabled=true;
    status.textContent='正在检查...';
    try{
      if(!('serviceWorker' in navigator)){throw new Error('当前浏览器不支持Service Worker')}
      // 强制重新注册 SW，触发更新检测
      const reg=await navigator.serviceWorker.register('./sw.js',{updateViaCache:'none'});
      await reg.update();
      // 等待 2 秒看是否有新 SW
      await new Promise(r=>setTimeout(r,2000));
      const waiting=reg.waiting;
      const active=reg.active;
      if(waiting){
        // 有新版本等待激活，通知它 skipWaiting
        waiting.postMessage({type:'SKIP_WAITING'});
        status.textContent='发现新版本，正在更新...';
        toast('发现新版本，正在更新...','success',3000);
      }else if(active){
        // 对比版本：fetch 当前页面的 ETag 或内容判断是否更新
        const resp=await fetch('./index.html?_t='+Date.now(),{cache:'no-store'});
        const html=await resp.text();
        const verMatch=html.match(/CACHE_VERSION='([^']+)'/);
        const serverVer=verMatch?verMatch[1]:'unknown';
        if(serverVer===CACHE_VERSION){
          status.textContent='当前已是最新版：v'+CACHE_VERSION;
          toast('当前已是最新版 ✓','success');
        }else{
          status.textContent='发现新版本 v'+serverVer+'，刷新页面即可生效';
          toast('发现新版本，刷新页面即可生效','info',4000);
        }
      }
    }catch(e){
      status.textContent='检查失败：'+e.message;
      toast('检查更新失败：'+e.message,'error',4000);
    }
    btn.innerHTML=old;btn.disabled=false;
  };
  const addCatSettingsBtn=$('#addCatSettingsBtn');
  if(addCatSettingsBtn)addCatSettingsBtn.onclick=addKnowledgeCategory;
  $$('[data-cat-edit]').forEach(b=>b.onclick=()=>editKnowledgeCategory(b.dataset.catEdit));
  $$('[data-cat-del]').forEach(b=>b.onclick=()=>deleteKnowledgeCategory(b.dataset.catDel));
}

async function exportAllData(){
  const customCats=await DB.getMeta('customCategories');
  const builtinOverrides=await DB.getMeta('builtinCategoryOverrides');
  const data={version:2,exportedAt:new Date().toISOString(),projects:State.projects,todos:State.todos,knowledge:State.knowledge,sops:State.sops,circuits:State.circuits,bugs:State.bugs,customCategories:customCats||[],builtinCategoryOverrides:builtinOverrides||{},config:Config.data};
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`工作台备份_${todayStr()}.json`;a.click();
  toast('已导出','success');
}
async function importAllData(e){
  const file=e.target.files[0];if(!file)return;
  if(!await confirmBox('导入将覆盖现有所有数据，确定继续？',{danger:true}))return;
  try{
    const text=await file.text();const data=JSON.parse(text);
    await DB.clear('projects');await DB.clear('todos');await DB.clear('knowledge');await DB.clear('sops');await DB.clear('circuits');await DB.clear('bugs');
    for(const p of(data.projects||[]))await DB.put('projects',p);
    for(const t of(data.todos||[]))await DB.put('todos',t);
    for(const k of(data.knowledge||[]))await DB.put('knowledge',k);
    for(const s of(data.sops||[]))await DB.put('sops',s);
    for(const c of(data.circuits||[]))await DB.put('circuits',c);
    for(const b of(data.bugs||[]))await DB.put('bugs',b);
    if(data.customCategories)await DB.setMeta('customCategories',data.customCategories);
    if(data.builtinCategoryOverrides)await DB.setMeta('builtinCategoryOverrides',data.builtinCategoryOverrides);
    if(data.config){Config.data=Object.assign({},Config.defaults,data.config);await Config.save()}
    await CategoryStore.reloadWithOverrides();
    await loadData();
    toast('导入成功','success');
    renderTopbar();renderMain();
  }catch(e){toast('导入失败：'+e.message,'error',5000)}
}
async function clearAllData(){
  if(!await confirmBox('将清空所有项目、任务、知识、电路、Bug、SOP数据，此操作不可恢复！',{danger:true,yesText:'确认清空'}))return;
  await DB.clear('projects');await DB.clear('todos');await DB.clear('knowledge');await DB.clear('sops');await DB.clear('circuits');await DB.clear('bugs');
  await loadData();
  toast('已清空','success');
  renderTopbar();renderMain();
}

/* ----------------------- 初始化 ----------------------- */
async function loadData(){
  State.projects=await DB.all('projects');
  State.todos=await DB.all('todos');
  State.knowledge=await DB.all('knowledge');
  State.sops=await DB.all('sops');
  State.circuits=await DB.all('circuits');
  State.bugs=await DB.all('bugs');
  State.currentProjectId=State.currentProjectId||(State.projects[0]?.id||'today');
}

async function init(){
  // 配置pdf.js worker
  if(window.pdfjsLib)pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js';
  // 配置marked
  if(window.marked)marked.setOptions({breaks:true,gfm:true});
  await DB.init();
  await Config.load();
  await CategoryStore.reloadWithOverrides();
  await loadData();
  // 应用自定义工作台名称：顶栏 + 标签页 + 动态manifest（安装应用名）
  const wbName=Config.get('workbenchName')||'工程师工作台';
  document.title='🔌 '+wbName;
  applyDynamicManifest();
  renderTopbar();
  renderMain();
  // 首次使用提示
  if(State.projects.length===0&&State.todos.length===0&&State.knowledge.length===0&&State.sops.length===0&&State.circuits.length===0&&State.bugs.length===0){
    setTimeout(()=>toast(`欢迎使用${wbName}！先在「待办清单」创建项目，或在「知识库」记录第一条知识。`,'info',6000),300);
  }
  // Service Worker 更新检测：打开应用时自动检查，有新版则提示刷新
  if('serviceWorker' in navigator){
    navigator.serviceWorker.addEventListener('controllerchange',()=>{
      // SW 已切换为新版，提示用户刷新
      toast('应用已更新到最新版，即将刷新...','success',3000);
      setTimeout(()=>location.reload(),1500);
    });
    // 监听 SW 发来的更新消息
    navigator.serviceWorker.addEventListener('message',e=>{
      if(e.data&&e.data.type==='SW_UPDATED'){
        toast('检测到新版本，已自动加载，刷新页面即可生效','info',5000);
      }
    });
  }
  // PWA 安装引导：监听 beforeinstallprompt，显示安装按钮
  let deferredPrompt = null;
  window.addEventListener('beforeinstallprompt', e => {
    e.preventDefault();
    deferredPrompt = e;
    // 显示一个浮动安装按钮
    const fab = document.createElement('div');
    fab.id = 'pwaInstallFab';
    fab.style.cssText = 'position:fixed;bottom:20px;right:20px;z-index:9998;background:linear-gradient(135deg,#ef4444,#a855f7);color:#fff;padding:12px 20px;border-radius:30px;box-shadow:0 8px 24px rgba(239,68,68,.4);font-size:13px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:6px;font-family:sans-serif;animation:fadeIn .3s';
    fab.innerHTML = '📲 安装到主屏幕';
    fab.onclick = async () => {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        const {outcome} = await deferredPrompt.userChoice;
        if (outcome === 'accepted') toast('已添加到主屏幕 ✨','success');
        deferredPrompt = null;
        fab.remove();
      }
    };
    document.body.appendChild(fab);
    toast('点击右下角按钮可安装到主屏幕 📲','info',5000);
  });
}

document.addEventListener('DOMContentLoaded',init);
// 注册 Service Worker（PWA 安装必需）
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('./sw.js')
      .then(reg=>console.log('SW 注册成功:',reg.scope))
      .catch(err=>console.warn('SW 注册失败:',err));
  });
}
</script>
